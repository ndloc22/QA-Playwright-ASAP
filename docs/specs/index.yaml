# OpenSpec Index — Starter Kit template
# Token-optimized, machine-readable summary of your project's domain docs.
# AI: ALWAYS read these specs first. Only open the original source doc when a spec
# entry is missing a detail you strictly need (each entry lists its `src` file).
#
# This file ships as a GENERIC TEMPLATE. Replace the placeholder descriptions below
# with your own project's business specs (extracted/condensed from your requirement
# docs), then keep the `codebase_specs` section as-is — it is auto-generated tooling.
meta:
  domain: <your business domain here>
  source_dir: docs/  # where your original requirement docs live (condense them into the spec files below)
  language_note: adjust if your source docs mix languages; field keys should use stable DB/EN names.
files:
  process.yaml: End-to-end process steps, statuses, roles, REST calls, branching conditions.
  roles.yaml:   Role concept, per-fieldset visible/editable matrix.
  fields.yaml:  Data dictionary — field formats, enums, and DB mappings.
codebase_specs:                    # extracted directly from application source (grounding truth)
  ui_components.yaml:   static per-dialog UI components (id/type/label/required) — generated by generate-codebase-specs.js.
  state_machine.yaml:   static per-process tasks/roles/transitions — generated by generate-codebase-specs.js.
  live_grounded_components.yaml: |
    REVERSE-GROUNDED live selectors extracted from Playwright codegen recordings
    (tests/recordings/<KEY>.recording.ts) via `npm run sync-specs`. HIGHEST-priority
    grounding source — these selectors were exercised on the REAL app, so when they
    overlap with ui_components.yaml, PREFER this file. Each component carries
    `origin: live_recording_<KEY>`. Auto-accumulated on every auto-test/regenerate run.
